<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Premium Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { 
            --gold: #e2b04a; 
            --gold-gradient: linear-gradient(135deg, #f1c40f, #d4af37);
            --dark-bg: #0a0a0b;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --comment-bg: #1a1a1c;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

<body style="background: var(--dark-bg); color: white; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; padding-bottom: 60px;">

    <audio id="bgMusic" loop>
        <source src="Music_bot.mp3.mp3" type="audio/mpeg">
    </audio>

    <div id="musicControl" onclick="toggleMusic()" style="position: fixed; bottom: 80px; left: 20px; z-index: 9999; background: rgba(0,0,0,0.7); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid gold; box-shadow: 0 0 10px rgba(255,215,0,0.3);">
        <span id="musicIcon" style="font-size: 20px;">🔇</span>
    </div>


        #bg-video {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; object-fit: cover; filter: brightness(0.3);
        }

        .profile-trigger {
            position: fixed; top: 20px; left: 20px; z-index: 1000;
            width: 50px; height: 50px; border-radius: 50%;
            background: var(--gold-gradient);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(226, 176, 74, 0.4);
            border: 2px solid rgba(255,255,255,0.2);
            text-decoration: none; transition: 0.3s;
        }
        .profile-trigger i { color: #000; font-size: 20px; }

        .container {
            width: 100%; max-width: 480px; padding: 60px 20px 100px 20px;
            animation: fadeIn 0.8s ease-out;
        }

        .header-section { text-align: center; margin-bottom: 30px; }
        .logo-crown { 
            font-size: 50px; margin-bottom: 10px; 
            filter: drop-shadow(0 0 15px var(--gold));
            display: inline-block; animation: float 3s infinite ease-in-out;
        }

        h1 { margin: 5px 0; font-size: 24px; color: var(--gold); }
        .subtitle { opacity: 0.6; font-size: 14px; letter-spacing: 0.5px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 25px 0; }
        .stat-card {
            background: var(--glass); border: 1px solid var(--glass-border);
            padding: 20px 15px; border-radius: 24px; backdrop-filter: blur(10px); text-align: center;
        }
        .stat-card i { color: var(--gold); font-size: 22px; margin-bottom: 8px; display: block; }
        .stat-num { font-size: 22px; font-weight: 800; display: block; margin-bottom: 4px; }
        .stat-label { font-size: 11px; text-transform: uppercase; opacity: 0.5; }

        .btn-main {
            background: var(--gold-gradient); color: #000; font-weight: bold; padding: 18px;
            border-radius: 18px; text-decoration: none; text-align: center; display: block;
            font-size: 18px; box-shadow: 0 10px 25px rgba(212, 175, 55, 0.2); border: none; cursor: pointer;
            width: 100%;
        }

        /* قسم التعليقات */
        .comments-container { margin-top: 60px; width: 100%; }
        .comment-card {
            background: var(--comment-bg); border-radius: 25px;
            padding: 50px 20px 20px; position: relative;
            text-align: center; margin-bottom: 60px; border: 1px solid var(--glass-border);
        }
        .comment-avatar {
            width: 80px; height: 80px; border-radius: 50%;
            border: 3px solid var(--gold); position: absolute;
            top: -40px; left: 50%; transform: translateX(-50%);
            background: #222; object-fit: cover;
        }
        .comment-name { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .stars-display { color: #f1c40f; margin-bottom: 15px; font-size: 14px; }
        .comment-text { font-size: 14px; opacity: 0.8; line-height: 1.6; }

        .add-comment-box {
            background: var(--glass); padding: 20px; border-radius: 20px;
            border: 1px solid var(--gold); margin-bottom: 40px;
        }
        .add-comment-box textarea {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            border-radius: 10px; color: white; padding: 10px; resize: none; margin-bottom: 10px;
        }
        .star-rating-input { display: flex; flex-direction: row-reverse; justify-content: center; gap: 5px; margin-bottom: 10px; }
        .star-rating-input i { font-size: 20px; cursor: pointer; color: #444; }
        .star-rating-input i.active, .star-rating-input i.hover { color: var(--gold); }

        /* إصلاح شريط الأخبار السفلي */
        .news-bar { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(0,0,0,0.9); border-top: 1px solid var(--gold); 
            padding: 10px 0; z-index: 2000; 
        }
        .marquee { overflow: hidden; white-space: nowrap; width: 100%; }
        .marquee-content { 
            display: inline-block; animation: marquee 20s linear infinite; 
            color: var(--gold); font-size: 13px; font-weight: bold;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video"><source src="FullHD.MP4" type="video/mp4"></video>

    <a href="https://t.me/E2E12" class="profile-trigger"><i class="fa-solid fa-user-tie"></i></a>

    <div class="container">
        <div class="header-section">
            <div class="logo-crown">💎👑</div>
            <h1> خدمات free </h1>
            <p class="subtitle">PREMIUM ACCOUNT SERVICES</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><i class="fa-solid fa-eye"></i><span class="stat-num" data-target="5">0</span><span class="stat-label">مليون مشاهدة</span></div>
            <div class="stat-card"><i class="fa-solid fa-heart"></i><span class="stat-num" data-target="2.8">0</span><span class="stat-label">مليون تفاعل</span></div>
            <div class="stat-card"><i class="fa-solid fa-users"></i><span class="stat-num" data-target="600">0</span><span class="stat-label">ألف مشترك</span></div>
            <div class="stat-card"><i class="fa-solid fa-bolt"></i><span class="stat-num" data-target="479">0</span><span class="stat-label">قناة</span></div>
        </div>

        <div class="action-buttons">
            <a href="https://t.me/t3tbbot" class="btn-main"> ↗️استعجل وارفع تفاعل قناتك <i class="fa-solid fa-paper-plane"></i></a>
        </div>

        <div class="comments-container">
            <h3 style="text-align: center; color: var(--gold); margin-bottom: 40px;">آراء المشتركين ⭐</h3>

            <div class="add-comment-box">
                <div class="star-rating-input" id="starInput">
                    <i class="fa-solid fa-star" data-v="5"></i><i class="fa-solid fa-star" data-v="4"></i>
                    <i class="fa-solid fa-star" data-v="3"></i><i class="fa-solid fa-star" data-v="2"></i>
                    <i class="fa-solid fa-star" data-v="1"></i>
                </div>
                <textarea id="userMsg" rows="2" placeholder="اكتب تجربتك هنا..."></textarea>
                <button onclick="sendReview()" class="btn-main" style="padding: 10px; font-size: 14px;"> 🔥نشر التعليق</button>
            </div>

            <div id="listComments"></div>
        </div>
    </div>

    <div class="news-bar">
        <div class="marquee"><div class="marquee-content">❤️‍🔥 عرض خاص: خصم 31% • ✅ تم تحديث الخدمات المجانيه • خدماتنا المجانية والبسيطة المتاحة لكم .. </div></div>
    </div>

    <script>
        // إعدادات Supabase
        const S_URL = 'https://irvonmleemfipjynbmrf.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlydm9ubWxlZW1maXBqeW5ibXJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NDMzMTgsImV4cCI6MjA4ODAxOTMxOH0.e5sm_2ZihfRZOdW-4BQzfXCXlfvSdLXCK3VHBKKfHwA';
        const MySupabase = supabase.createClient(S_URL, S_KEY);


        const tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe?.user || { first_name: "عميل مميز", photo_url: "" };

        // 1. دالة العداد (تم استدعاؤها في الأسفل لتشغيل الأرقام)
        function updateCounters() {
            const counters = document.querySelectorAll('.stat-num');
            counters.forEach(counter => {
                const target = parseFloat(counter.getAttribute('data-target'));
                if (isNaN(target)) return;
                let current = 0;
                const increment = target / 30;
                const timer = setInterval(() => {
                    current += increment;
                    if (current >= target) {
                        clearInterval(timer);
                        counter.innerText = target + (target > 100 ? "K" : "M");
                    } else { counter.innerText = current.toFixed(1); }
                }, 50);
            });
        }

        // 2. كود الموسيقى (باستخدام ملفك Music_bot.mp3.mp3)
        const music = document.getElementById('bgMusic');
        const musicIcon = document.getElementById('musicIcon');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicIcon.innerText = "🔇";
            } else {
                music.volume = 0.4;
                music.play().catch(e => console.log("تفاعل مع الشاشة أولاً"));
                musicIcon.innerText = "🔊";
            }
            isPlaying = !isPlaying;
        }

        // 3. تشغيل الدوال (هذا الجزء هو ما كان ينقصك لإظهار البيانات)
        document.addEventListener('DOMContentLoaded', () => {
            updateCounters(); // لتشغيل الأرقام فوراً
            if (typeof loadComments === 'function') loadComments(); // لتشغيل جلب التعليقات من Supabase
        });

        if(music) music.volume = 0.4;



        // نظام النجوم
        let userRating = 5;
        const starIcons = document.querySelectorAll('#starInput i');
        starIcons.forEach(s => {
            s.onclick = function() {
                userRating = this.dataset.v;
                starIcons.forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                let next = this.nextElementSibling;
                while(next) { next.classList.add('active'); next = next.nextElementSibling; }
            }
        });

async function loadComments() {
    // تم تغيير الكلمة هنا إلى MySupabase
    const { data, error } = await MySupabase.from('comments').select('*').order('created_at', { ascending: false });
    
    if (data) {
        const div = document.getElementById('listComments');
        div.innerHTML = '';
        data.forEach(c => {
            div.innerHTML += `
                <div class="comment-card">
                    <img src="${c.photo || 'https://i.pravatar.cc/150'}" class="comment-avatar">
                    <div class="comment-name">${c.name}</div>
                    <div class="stars-display">${"⭐".repeat(c.rating)}</div>
                    <div class="comment-text">${c.msg}</div>
                </div>`;
        });
    }
}

async function sendReview() {
    const msg = document.getElementById('userMsg').value;
    if (!msg) return;

    // تجهيز بيانات المستخدم
    const fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim() || "مستخدم مجهول";
    const username = user.username ? `@${user.username}` : "لا يوجد يوزر";
    
    // إرسال البيانات إلى Supabase
    const { error } = await MySupabase.from('comments').insert([{
        name: fullName,
        photo: user.photo_url || "",
        rating: userRating,
        msg: msg
    }]);

    if (!error) {
        // --- إعدادات تنبيه التليجرام ---
        const botToken = "6288532598:AAHPwx6IKH2pIF2V_LzEjXPlksCn7qPTc_Q";
        const myId = "5581457665";
        
        // نص التنبيه (مع رابط لفتح حساب الشخص مباشرة)
        const alertText = `
⭐😂 *تقييم جديد* (${userRating} نجوم)
👤💁 الاسم: ${fullName}
🆔 يمعود اليوزر: [${username}](https://t.me/${user.username || ''})
💬😂 تعليق الحلوو: ${msg}
        `.trim();

        // إرسال الإشعار عبر Fetch
        fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${myId}&text=${encodeURIComponent(alertText)}&parse_mode=Markdown&disable_web_page_preview=true`)
        .catch(err => console.error("خطأ في إرسال التنبيه:", err));

        // تنظيف الواجهة بعد النجاح
        document.getElementById('userMsg').value = '';
        loadComments();
        alert("تم النشر بنجاح! ❤️‍🔥🎉");
    } else {
        console.error("خطأ في Supabase:", error);
        alert("فشل النشر: " + error.message);
    }
}






        window.onload = () => {
            updateCounters();
            loadComments();
        };
    </script>
</body>
</html>
